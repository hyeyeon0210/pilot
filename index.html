<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pilot — AI 프로젝트 학습 플랫폼</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="pilot-header">
    <div class="pilot-logo">P<span>ilot</span></div>
    <div class="pilot-badge">AI 프로젝트 학습</div>
  </header>

  <main class="pilot-landing">
    <h1>Pilot에 오신 것을 환영합니다</h1>
    <p>학생은 소크라테스식 질문으로 프로젝트를 함께 만들어가고,<br>교사는 학생 산출물을 성취기준에 근거해 정리할 수 있어요.</p>

    <div class="pilot-choice-grid">
      <a class="pilot-choice-card pilot-choice-card--student" href="student.html">
        <div class="icon">🧑‍🎓</div>
        <h2>학생으로 시작하기</h2>
        <p>Pilot Learning Coach와 함께 탐구·프로젝트를 진행합니다.</p>
      </a>
      <a class="pilot-choice-card pilot-choice-card--teacher" href="teacher.html">
        <div class="icon">🧑‍🏫</div>
        <h2>교사로 시작하기</h2>
        <p>Pilot Management Coach로 학생 산출물을 정리합니다.</p>
      </a>
    </div>
  </main>
</body>
</html>
