<body>
  <main class="pilot-landing pilot-landing--hero">

    <div class="pilot-choice-grid pilot-choice-grid--single">

      </a>

  <a class="pilot-teacher-link pilot-teacher-link--corner" href="teacher.html">선생님이신가요?</a>
